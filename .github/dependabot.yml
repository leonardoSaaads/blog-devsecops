# Dependabot: a single update every 6 months.
#
# - One pull request (and one branch) with ALL dependencies — npm and GitHub
#   Actions together — thanks to the "dependencies" multi-ecosystem group.
# - Runs semiannually (`semiannually`); nothing runs between windows.
# - Security alerts (Dependabot security updates) stay independent of this
#   schedule: vulnerability fixes arrive as soon as they are published.
#
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: semiannually
    labels: ["dependencies"]

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      # TypeScript 7 (native compiler): typescript-eslint does not support 7.0 yet
      # (support is planned for 7.1+). Upgrade manually once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the production Node version (.nvmrc = 24 LTS). Bump the
      # major together with .nvmrc, never on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
