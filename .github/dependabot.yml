version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      testing:
        patterns:
          ["vitest", "@vitest/*", "@playwright/test", "@axe-core/*", "@testing-library/*", "jsdom"]
      markdown:
        patterns: ["@mdx-js/*", "remark-*", "rehype-*", "shiki", "@shikijs/*", "katex"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
