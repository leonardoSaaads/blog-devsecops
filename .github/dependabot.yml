# Dependabot: uma única atualização a cada 6 meses.
#
# - Um só pull request (e uma só branch) com TODAS as dependências — npm e GitHub
#   Actions juntas —, graças ao grupo multiecossistema "dependencias".
# - Execução semestral (`semiannually`); nada roda entre uma janela e outra.
# - Alertas de segurança (Dependabot security updates) continuam independentes deste
#   agendamento: correções de vulnerabilidade chegam assim que publicadas.
#
# Referência: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

multi-ecosystem-groups:
  dependencias:
    schedule:
      interval: semiannually
    labels: ["dependencies"]

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencias
    patterns: ["*"]
    ignore:
      # TypeScript 7 (compilador nativo): o typescript-eslint ainda não suporta a versão
      # 7.0 (o suporte está previsto para 7.1+). Atualize manualmente quando houver.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node acompanha a versão do Node em produção (.nvmrc = 24 LTS). Atualize
      # o major junto com o .nvmrc, nunca isoladamente.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencias
    patterns: ["*"]
